<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HPCA Flash Sheets</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: flashcard deck. Sticky bar (lesson strip + flip controls) over one full sheet.
   Sheet = gist banner, then two columns: concept side (figure, points, table) | interview side (numbers, worked, DV, bugs, Q&A). */
:root{
  --bg:#f3f4f2; --panel:#ffffff; --ink:#18201f; --muted:#5b6765; --line:#d5dbd8;
  --copper:#b05a22; --copper-soft:#f6e6da; --trace:#2f6f62; --trace-soft:#dcece7;
  --warn:#a33a2a; --warn-soft:#f5e0dc; --grid:#e6eae8;
  --display:"Chakra Petch","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111615; --panel:#181f1e; --ink:#e4eae8; --muted:#97a3a0; --line:#2b3533;
  --copper:#e08a4f; --copper-soft:#3a2618; --trace:#6cc2ad; --trace-soft:#183530;
  --warn:#ef8a78; --warn-soft:#3b1f1a; --grid:#222b29; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111615; --panel:#181f1e; --ink:#e4eae8; --muted:#97a3a0; --line:#2b3533;
  --copper:#e08a4f; --copper-soft:#3a2618; --trace:#6cc2ad; --trace-soft:#183530;
  --warn:#ef8a78; --warn-soft:#3b1f1a; --grid:#222b29; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.in{max-width:1240px;margin:0 auto}
code{font-family:var(--mono);font-size:.84em;background:var(--grid);padding:1px 5px;border-radius:3px;word-break:break-word}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}
.bar .in{display:grid;gap:8px;padding-block:10px}
.row1{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;justify-content:space-between}
.brand{font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:.01em}
.brand span{color:var(--copper)}
.ctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.btn{font-family:var(--mono);font-size:12.5px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:6px 12px;cursor:pointer}
.btn:hover{border-color:var(--copper)}
.btn:focus-visible,select:focus-visible,.chip:focus-visible,summary:focus-visible{outline:2px solid var(--copper);outline-offset:2px}
.btn[aria-pressed="true"]{background:var(--trace-soft);border-color:var(--trace);color:var(--trace)}
select{font-family:var(--mono);font-size:12.5px;padding:6px 8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);max-width:min(340px,70vw)}
.count{font-family:var(--mono);font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:7ch;text-align:center}
.strip{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.chip{flex:none;font-family:var(--mono);font-size:11.5px;border:1px solid var(--line);background:none;color:var(--ink);padding:4px 9px;cursor:pointer;white-space:nowrap}
.chip b{color:var(--copper);font-weight:600;margin-right:4px}
.chip.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.chip.on b{color:var(--copper-soft)}
.chip:disabled{opacity:.45;cursor:default;border-style:dashed}

/* sheet */
main .in{padding-block:18px 48px}
.sheet{background:var(--panel);border:1px solid var(--line)}
.sh-top{padding:16px 22px 14px;border-bottom:1px solid var(--line);display:grid;gap:6px}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.meta .les{color:var(--copper)}
.sh-top h1{font-family:var(--display);font-weight:600;font-size:clamp(24px,3.4vw,34px);line-height:1.12;margin:0;text-wrap:balance}
.gist{margin:4px 0 0;font-size:17px;line-height:1.45;max-width:80ch;border-left:3px solid var(--copper);padding-left:12px;text-wrap:pretty}
.cols{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,1fr)}
.col{padding:16px 22px 20px;display:grid;gap:16px;align-content:start;min-width:0}
.col+.col{border-left:1px solid var(--line);background:color-mix(in srgb,var(--bg) 45%,var(--panel))}
@media (max-width:880px){.cols{grid-template-columns:minmax(0,1fr)}.col+.col{border-left:0;border-top:1px solid var(--line)}}
h2.lbl{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;margin:0 0 7px;color:var(--muted);display:flex;align-items:center;gap:7px}
h2.lbl::before{content:"";width:8px;height:8px;background:currentColor}
.lbl.cu{color:var(--copper)} .lbl.tr{color:var(--trace)} .lbl.wa{color:var(--warn)}
ul.pts{margin:0;padding-left:18px;display:grid;gap:6px}
ul.pts li::marker{color:var(--copper)}
.fig{border:1px dashed var(--line);background:var(--bg);padding:10px;overflow-x:auto}
.fig svg{display:block;width:100%;height:auto;min-width:460px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
th{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--bg)}
td{font-variant-numeric:tabular-nums}
.nums{display:flex;flex-wrap:wrap;gap:7px}
.num{font-family:var(--mono);font-size:12.5px;border:1px solid var(--copper);color:var(--ink);background:var(--copper-soft);padding:4px 9px}
.wk{display:grid;gap:5px}
.wk div{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:baseline;border-bottom:1px dotted var(--line);padding-bottom:5px;font-size:14px}
.wk .a{font-family:var(--mono);font-size:13px;font-weight:600;text-align:right}
@media (max-width:520px){.wk div{grid-template-columns:minmax(0,1fr)}.wk .a{text-align:left}}
.fix{border:1px dashed var(--warn);padding:9px 12px;font-size:14px}
.bugs{border-left:3px solid var(--warn);background:var(--warn-soft);padding:9px 12px}
.bugs ul,.dv ul{margin:0;padding-left:18px;display:grid;gap:5px;font-size:14.2px}
details{border-top:1px solid var(--line)}
details:last-of-type{border-bottom:1px solid var(--line)}
summary{cursor:pointer;list-style:none;padding:8px 2px;font-weight:500;display:flex;gap:9px}
summary::-webkit-details-marker{display:none}
summary::before{content:"Q";font-family:var(--mono);font-weight:600;color:var(--copper)}
details[open] summary::before{content:"A"}
.ans{padding:0 2px 10px 22px;font-size:14.2px}
.foot{display:flex;justify-content:space-between;gap:10px;margin-top:14px;font-family:var(--mono);font-size:12px;color:var(--muted);flex-wrap:wrap}
.empty{padding:40px 22px;text-align:center;color:var(--muted)}

/* svg tokens */
svg text{font-family:var(--mono);font-size:12px}
.s-ink{fill:var(--ink)} .s-mut{fill:var(--muted)} .s-cu{fill:var(--copper)} .s-tr{fill:var(--trace)} .s-wa{fill:var(--warn)}
.s-box{fill:var(--panel);stroke:var(--ink);stroke-width:1.2}
.s-cubox{fill:var(--copper-soft);stroke:var(--copper);stroke-width:1.2}
.s-trbox{fill:var(--trace-soft);stroke:var(--trace);stroke-width:1.2}
.s-wbox{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.2}
.s-line{stroke:var(--ink);stroke-width:1.2;fill:none}
.s-grid{stroke:var(--grid);stroke-width:1;fill:none}
.s-cul{stroke:var(--copper);stroke-width:2;fill:none}
.s-trl{stroke:var(--trace);stroke-width:2;fill:none}
.s-wal{stroke:var(--warn);stroke-width:2;fill:none}
.tb{font-weight:600}
</style>
</head>
<body>

<header class="bar gut">
 <div class="in">
  <div class="row1">
   <div class="brand">HPCA <span>Flash Sheets</span></div>
   <div class="ctl">
    <button class="btn" id="prev" type="button" aria-label="Previous sheet">← Prev</button>
    <span class="count" id="count">–</span>
    <button class="btn" id="next" type="button" aria-label="Next sheet">Next →</button>
    <label for="jump" class="count" style="min-width:0">Go to</label>
    <select id="jump"></select>
    <button class="btn" id="reveal" type="button" aria-pressed="false">Show answers</button>
   </div>
  </div>
  <nav class="strip" id="strip" aria-label="Lessons"></nav>
 </div>
</header>

<main class="gut"><div class="in">
 <article class="sheet" id="sheet" aria-live="polite"></article>
 <div class="foot"><span>← → keys flip sheets · lessons 1–12 follow your notes · 13–22 follow the course content (no notes yet)</span><span id="built"></span></div>
</div></main>

<script>
window.LESSONS=[
 [1,"Introduction"],[2,"Metrics & evaluation"],[3,"Pipelining"],[4,"Branch prediction"],[5,"Predication"],
 [6,"ILP"],[7,"Tomasulo"],[8,"Reorder buffer"],[9,"Memory ordering"],[10,"Compiler ILP"],[11,"VLIW"],
 [12,"Cache review"],[13,"Virtual memory"],[14,"Advanced caches"],[15,"Memory (DRAM)"],[16,"Storage"],
 [17,"Fault tolerance"],[18,"Multiprocessing"],[19,"Cache coherence"],[20,"Synchronization"],
 [21,"Memory consistency"],[22,"Many-cores"]];
</script>
<script src="b01.js"></script>
<script src="b02.js"></script>
<script src="b03.js"></script>
<script src="b04.js"></script>
<script src="b05.js"></script>
<script>
(function(){
const NS="http://www.w3.org/2000/svg";
/* ---------- figures (drawn to scale where they plot numbers) ---------- */
const F={
layers:()=>`<svg viewBox="0 0 560 190" role="img" aria-label="Layers from application down to transistors with ISA as the contract">
 ${[["Application · OS · compiler","s-box"],["ISA — the contract (architectural)","s-cubox"],["Microarchitecture — pipeline, caches, predictors","s-trbox"],["Circuits · fabrication technology","s-box"]].map((r,i)=>`<rect class="${r[1]}" x="20" y="${12+i*42}" width="380" height="34"/><text class="s-ink ${i==1?'tb':''}" x="34" y="${34+i*42}">${r[0]}</text>`).join("")}
 <path class="s-cul" d="M412 63 H440 V135 H412"/><text class="s-cu" x="448" y="96">DV checks</text><text class="s-cu" x="448" y="112">µarch vs ISA</text>
</svg>`,
memwall:()=>{const xs=[60,188,316,444,572,700].map(x=>x*0.78);const yv=v=>190-Math.log2(v)/5*160;
 const cpu=[1,2,4,8,16,32],mem=[1,1.1,1.21,1.331,1.4641,1.6105];
 const pl=a=>a.map((v,i)=>`${i?'L':'M'}${xs[i].toFixed(1)} ${yv(v).toFixed(1)}`).join(" ");
 return `<svg viewBox="0 0 590 220" role="img" aria-label="Processor speed doubles every 2 years to 32x over 10 years while memory latency improves 1.1x per 2 years to 1.6x">
 ${[1,2,4,8,16,32].map(v=>`<line class="s-grid" x1="40" x2="560" y1="${yv(v)}" y2="${yv(v)}"/><text class="s-mut" x="6" y="${yv(v)+4}">${v}×</text>`).join("")}
 ${xs.map((x,i)=>`<text class="s-mut" x="${x-8}" y="210">${i*2}y</text>`).join("")}
 <path class="s-cul" d="${pl(cpu)}"/><path class="s-trl" d="${pl(mem)}"/>
 <text class="s-cu tb" x="${xs[5]-150}" y="${yv(32)+4}">CPU 32×</text><text class="s-tr tb" x="${xs[5]-150}" y="${yv(1.61)-8}">memory latency 1.6×</text>
 </svg>`},
ucurve:()=>{let d1="",d2="",d3="";for(let i=0;i<=40;i++){const v=0.6+i*0.02,x=60+i*12;const dyn=v*v*v*40,st=6/Math.pow(v,4)*0.9;const tot=dyn+st;
 const y=a=>200-a*1.6;d1+=(i?"L":"M")+x+" "+y(dyn).toFixed(1)+" ";d2+=(i?"L":"M")+x+" "+y(st).toFixed(1)+" ";d3+=(i?"L":"M")+x+" "+y(tot).toFixed(1)+" ";}
 return `<svg viewBox="0 0 590 220" role="img" aria-label="Schematic: dynamic power rises with voltage, leakage falls, total is U-shaped with a minimum">
 <line class="s-line" x1="60" y1="200" x2="560" y2="200"/><line class="s-line" x1="60" y1="20" x2="60" y2="200"/>
 <path class="s-cul" d="${d1}"/><path class="s-wal" d="${d2}"/><path class="s-trl" d="${d3}" stroke-width="3"/>
 <text class="s-cu" x="430" y="60">dynamic</text><text class="s-wa" x="70" y="40">leakage</text><text class="s-tr tb" x="250" y="118">total</text>
 <text class="s-mut" x="470" y="214">voltage →</text><text class="s-mut" x="66" y="16">power (schematic)</text></svg>`},
ironlaw:()=>`<svg viewBox="0 0 590 130" role="img" aria-label="Iron law: CPU time equals instructions times CPI times clock period">
 <text class="s-ink tb" x="6" y="38" style="font-size:16px">Time =</text>
 <rect class="s-box" x="76" y="14" width="140" height="38"/><text class="s-ink tb" x="90" y="38">Instructions</text>
 <text class="s-ink" x="224" y="38">×</text><rect class="s-cubox" x="240" y="14" width="120" height="38"/><text class="s-ink tb" x="268" y="38">CPI</text>
 <text class="s-ink" x="368" y="38">×</text><rect class="s-trbox" x="384" y="14" width="150" height="38"/><text class="s-ink tb" x="398" y="38">Clock period</text>
 <text class="s-mut" x="76" y="74">algorithm</text><text class="s-mut" x="76" y="90">compiler, ISA</text>
 <text class="s-mut" x="240" y="74">ISA</text><text class="s-mut" x="240" y="90">µarch design</text>
 <text class="s-mut" x="384" y="74">µarch, circuits</text><text class="s-mut" x="384" y="90">transistors</text>
 <text class="s-cu" x="6" y="120">3 B × 2 / 3 GHz = 2 s</text></svg>`,
amdahl:()=>{const X=f=>60+f/0.9*480,Y=s=>196-(s-1)/9*170;const cur=s=>{let d="";for(let i=0;i<=90;i++){const f=i/100,v=1/((1-f)+f/s);d+=(i?"L":"M")+X(f).toFixed(1)+" "+Y(Math.min(v,10)).toFixed(1)+" ";}return d};
 return `<svg viewBox="0 0 590 226" role="img" aria-label="Amdahl curves: overall speedup versus fraction enhanced, for part speedups of 2, 10 and infinity">
 ${[1,4,7,10].map(v=>`<line class="s-grid" x1="60" x2="540" y1="${Y(v)}" y2="${Y(v)}"/><text class="s-mut" x="24" y="${Y(v)+4}">${v}×</text>`).join("")}
 ${[0,0.3,0.6,0.9].map(f=>`<text class="s-mut" x="${X(f)-10}" y="216">${f}</text>`).join("")}
 <path class="s-trl" d="${cur(2)}"/><path class="s-cul" d="${cur(10)}"/><path class="s-wal" d="${cur(1e9)}"/>
 <text class="s-tr" x="470" y="${Y(1.82)-6}">s=2</text><text class="s-cu" x="470" y="${Y(5.26)-6}">s=10</text><text class="s-wa" x="470" y="${Y(10)+16}">s=∞</text>
 <text class="s-mut" x="380" y="216">fraction f →</text></svg>`},
pipe5:()=>{const st=["IF","ID","EX","MEM","WB"];let g="";for(let r=0;r<4;r++)for(let k=0;k<5;k++){const c=r+k;g+=`<rect class="${k==2?'s-cubox':'s-box'}" x="${80+c*58}" y="${20+r*34}" width="54" height="28"/><text class="s-ink" x="${86+c*58}" y="${39+r*34}">${st[k]}</text>`;}
 return `<svg viewBox="0 0 590 200" role="img" aria-label="Five-stage pipeline: four instructions overlapping one stage apart">
 ${[0,1,2,3].map(r=>`<text class="s-mut" x="6" y="${39+r*34}">instr ${r+1}</text>`).join("")}${g}
 <text class="s-cu" x="80" y="180">latency 5 cycles each · after fill, 1 completes per cycle → 10 instr = 5 + 9 = 14</text></svg>`},
flush:()=>{const row=(r,lab,cells,cls)=>`<text class="s-mut" x="6" y="${39+r*34}">${lab}</text>`+cells.map((s,k)=>s?`<rect class="${cls[k]||'s-box'}" x="${90+(r+k)*58}" y="${20+r*34}" width="54" height="28"/><text class="s-ink" x="${96+(r+k)*58}" y="${39+r*34}">${s}</text>`:"").join("");
 return `<svg viewBox="0 0 590 190" role="img" aria-label="Branch resolves in EX; the two younger wrong-path instructions are flushed into bubbles">
 ${row(0,"BEQ",["IF","ID","EX","MEM","WB"],["","","s-cubox"])}
 ${row(1,"wrong 1",["IF","ID","—","—"],["s-wbox","s-wbox","s-wbox","s-wbox"])}
 ${row(2,"wrong 2",["IF","—","—"],["s-wbox","s-wbox","s-wbox"])}
 ${row(3,"target",["IF","ID","EX","MEM"],["s-trbox","s-trbox","s-trbox","s-trbox"])}
 <text class="s-cu" x="90" y="176">branch known at end of EX → 2 bubbles = penalty 2</text></svg>`},
deps:()=>`<svg viewBox="0 0 590 170" role="img" aria-label="Three-instruction example showing RAW, WAR and WAW arrows">
 <text class="s-ink" x="20" y="34">I1: ADD R1, R2, R3</text><text class="s-ink" x="20" y="84">I2: SUB R4, R1, R5</text><text class="s-ink" x="20" y="134">I3: MUL R1, R4, R4</text>
 <path class="s-cul" d="M200 30 C 240 40, 240 70, 200 80"/><text class="s-cu" x="250" y="58">RAW on R1 (true)</text>
 <path class="s-trl" d="M200 86 C 240 96, 240 120, 200 130"/><text class="s-tr" x="250" y="112">RAW on R4 · WAR on R1</text>
 <path class="s-wal" d="M180 26 C 330 40, 330 120, 180 136"/><text class="s-wa" x="340" y="80">WAW on R1 (output)</text>
 <text class="s-mut" x="20" y="162">renaming removes WAR and WAW, never RAW</text></svg>`,
fwd:()=>`<svg viewBox="0 0 590 180" role="img" aria-label="ALU to ALU forwarding with no stall and load to use with one stall then forwarding">
 ${["IF","ID","EX","MEM","WB"].map((s,k)=>`<rect class="${k==3?'s-cubox':'s-box'}" x="${110+k*58}" y="16" width="54" height="26"/><text class="s-ink" x="${116+k*58}" y="34">${s}</text>`).join("")}<text class="s-mut" x="6" y="34">LW R1</text>
 ${["IF","ID","stall","EX","MEM"].map((s,k)=>`<rect class="${s=='stall'?'s-wbox':(k==3?'s-trbox':'s-box')}" x="${168+k*58}" y="56" width="54" height="26"/><text class="s-ink" x="${172+k*58}" y="74">${s}</text>`).join("")}<text class="s-mut" x="6" y="74">ADD ..R1</text>
 <path class="s-cul" d="M330 42 L 352 56"/><text class="s-cu" x="110" y="112">MEM→EX forward after 1 bubble (value exists only after MEM)</text>
 <text class="s-tr" x="110" y="132">ALU→ALU: EX→EX forward, 0 stalls</text>
 <text class="s-mut" x="110" y="152">control hazard: flush · data hazard: forward, else stall</text></svg>`,
depth:()=>{let a="",b="";for(let n=5;n<=50;n++){const x=60+(n-5)*10.4;const perf=Math.exp(-Math.pow((n-35)/18,2)),pw=Math.exp(-Math.pow((n-13)/9,2));a+=(n>5?"L":"M")+x.toFixed(1)+" "+(190-perf*150).toFixed(1)+" ";b+=(n>5?"L":"M")+x.toFixed(1)+" "+(190-pw*150).toFixed(1)+" ";}
 return `<svg viewBox="0 0 590 220" role="img" aria-label="Schematic: performance alone peaks near 35 stages; performance per watt peaks near 13 stages">
 <line class="s-line" x1="60" y1="190" x2="540" y2="190"/>${[5,15,25,35,45].map(n=>`<text class="s-mut" x="${60+(n-5)*10.4-6}" y="206">${n}</text>`).join("")}
 <path class="s-cul" d="${a}"/><path class="s-trl" d="${b}"/>
 <text class="s-cu" x="${60+30*10.4-30}" y="32">performance only</text><text class="s-tr" x="${60+8*10.4-20}" y="32">perf + power</text>
 <text class="s-mut" x="440" y="218">stages (schematic)</text></svg>`},
bpneed:()=>`<svg viewBox="0 0 590 170" role="img" aria-label="Fetch needs the next PC one cycle after the branch is fetched, but the branch is decoded one stage later and resolved in EX">
 ${["IF","ID","EX","MEM","WB"].map((s,k)=>`<rect class="${k==2?'s-cubox':'s-box'}" x="${90+k*58}" y="20" width="54" height="28"/><text class="s-ink" x="${96+k*58}" y="39">${s}</text>`).join("")}<text class="s-mut" x="6" y="39">BEQ</text>
 <rect class="s-wbox" x="148" y="60" width="54" height="28"/><text class="s-ink" x="154" y="79">IF ?</text><text class="s-mut" x="6" y="79">next</text>
 <path class="s-wal" d="M175 60 V52"/><text class="s-wa" x="214" y="79">needs next PC now: not even decoded yet</text>

 <path class="s-cul" d="M480 94 C 450 160, 360 176, 324 160"/><text class="s-cu" x="420" y="172">snoop GetS → S (data)</text>
 <path class="s-cul" d="M256 164 C 200 196, 140 196, 112 176"/><text class="s-cu" x="120" y="205">snoop GetM/Inv → I</text></svg>`,
dir:()=>`<svg viewBox="0 0 590 190" role="img" aria-label="Directory write miss: requester asks home, home invalidates sharers, sharers ack, requester gets data and becomes M">
 <rect class="s-trbox" x="20" y="70" width="120" height="44"/><text class="s-ink tb" x="34" y="96">requester</text>
 <rect class="s-cubox" x="235" y="10" width="140" height="56"/><text class="s-ink tb" x="248" y="32">home + dir</text><text class="s-mut" x="248" y="52">S: {B, C}</text>
 <rect class="s-box" x="440" y="70" width="120" height="34"/><text class="s-ink" x="470" y="92">sharer B</text>
 <rect class="s-box" x="440" y="130" width="120" height="34"/><text class="s-ink" x="470" y="152">sharer C</text>
 <path class="s-line" d="M140 80 L235 40"/><text class="s-ink" x="150" y="50">1 GetM</text>
 <path class="s-cul" d="M375 40 L440 84 M375 50 L440 140"/><text class="s-cu" x="390" y="56">2 Inv</text>
 <path class="s-trl" d="M440 100 L140 100 M440 150 L140 108"/><text class="s-tr" x="250" y="128">3 Acks → requester</text>
 <path class="s-line" d="M260 66 L140 92"/><text class="s-ink" x="150" y="76">data + ack count</text>
 <text class="s-mut" x="20" y="184">requester becomes M after data and all acks arrive</text></svg>`
};
/* ---------- deck ---------- */
const S=(window.SHEETS||[]).slice().sort((a,b)=>a.id<b.id?-1:1);
const have=new Set(S.map(s=>s.L));
const strip=document.getElementById("strip"),jump=document.getElementById("jump"),sheet=document.getElementById("sheet");
let i=0, reveal=true;
try{const v=localStorage.getItem("hpca-reveal");if(v!==null)reveal=v==="1"}catch(e){}
LESSONS.forEach(([n,name])=>{const b=document.createElement("button");b.className="chip";b.type="button";b.dataset.l=n;
 b.innerHTML="<b>"+String(n).padStart(2,"0")+"</b>"+name;b.disabled=!have.has(n);if(!have.has(n))b.title="Coming in a later batch";
 b.addEventListener("click",()=>{const k=S.findIndex(s=>s.L===n);if(k>=0)go(k)});strip.appendChild(b)});
S.forEach((s,k)=>{const o=document.createElement("option");o.value=k;o.textContent=s.id+" · "+s.t;jump.appendChild(o)});
jump.addEventListener("change",()=>go(+jump.value));
document.getElementById("prev").onclick=()=>go(i-1);
document.getElementById("next").onclick=()=>go(i+1);
const rv=document.getElementById("reveal");
function setRv(){rv.setAttribute("aria-pressed",reveal?"true":"false");rv.textContent=reveal?"Hide answers":"Show answers";sheet.querySelectorAll("details").forEach(d=>d.open=reveal)}
rv.onclick=()=>{reveal=!reveal;try{localStorage.setItem("hpca-reveal",reveal?"1":"0")}catch(e){}setRv()};
document.addEventListener("keydown",e=>{if(e.target.tagName==="SELECT")return;if(e.key==="ArrowRight")go(i+1);if(e.key==="ArrowLeft")go(i-1)});
const L=n=>(LESSONS.find(x=>x[0]===n)||[0,""])[1];
const sec=(lbl,cls,html)=>html?`<section><h2 class="lbl ${cls}">${lbl}</h2>${html}</section>`:"";
const ul=a=>a&&a.length?`<ul class="pts">${a.map(x=>`<li>${x}</li>`).join("")}</ul>`:"";
const tb=t=>t?`<div class="tbl"><table><tr>${t[0].map(h=>`<th>${h}</th>`).join("")}</tr>${t.slice(1).map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</table></div>`:"";
function render(){
 const s=S[i];if(!s){sheet.innerHTML='<div class="empty">No sheets loaded.</div>';return}
 const sameL=S.filter(x=>x.L===s.L),pos=sameL.indexOf(s)+1;
 sheet.innerHTML=`<div class="sh-top"><div class="meta"><span class="les">Lesson ${String(s.L).padStart(2,"0")} · ${L(s.L)}</span><span>${s.vids}</span><span>Sheet ${pos} / ${sameL.length}</span><span>${s.id}</span></div>
 <h1>${s.t}</h1><p class="gist">${s.gist}</p></div>
 <div class="cols"><div class="col">
  ${s.fig&&F[s.fig]?`<figure class="fig" style="margin:0">${F[s.fig]()}</figure>`:""}
  ${sec("Concepts","cu",ul(s.pts))}
  ${s.tbl?sec("At a glance","",tb(s.tbl)):""}
  ${s.fix?`<div class="fix"><h2 class="lbl wa">Check your notes</h2>${ul(s.fix)}</div>`:""}
 </div><div class="col">
  ${s.nums?sec("Numbers & formulas","cu",`<div class="nums">${s.nums.map(n=>`<span class="num">${n}</span>`).join("")}</div>`):""}
  ${s.wk?sec("Worked","cu",`<div class="wk">${s.wk.map(w=>`<div><span>${w[0]}</span><span class="a">${w[1]}</span></div>`).join("")}</div>`):""}
  ${sec("Verification lens","tr",`<div class="dv">${ul(s.dv)}</div>`)}
  ${s.bugs?`<div class="bugs"><h2 class="lbl wa">Bugs that ship</h2>${ul(s.bugs)}</div>`:""}
  ${s.qa?sec("Interview","",s.qa.map(q=>`<details><summary>${q[0]}</summary><div class="ans">${q[1]}</div></details>`).join("")):""}
 </div></div>`;
 document.getElementById("count").textContent=(i+1)+" / "+S.length;
 jump.value=i;
 strip.querySelectorAll(".chip").forEach(c=>c.classList.toggle("on",+c.dataset.l===s.L));
 const on=strip.querySelector(".chip.on");if(on&&on.scrollIntoView)on.scrollIntoView({block:"nearest",inline:"nearest"});
 document.getElementById("prev").disabled=i===0;document.getElementById("next").disabled=i===S.length-1;
 setRv();
}
function go(k){if(k<0||k>=S.length)return;i=k;try{history.replaceState(null,"","#"+S[i].id.replace(/[^A-Za-z0-9_-]/g,""))}catch(e){}render();window.scrollTo({top:0})}
const h=(location.hash||"").slice(1);const start=S.findIndex(s=>s.id===h);
document.getElementById("built").textContent=S.length+" sheets · "+have.size+" of "+LESSONS.length+" lessons built";
i=start>=0?start:0;render();
})();
</script>
</body>
</html>
